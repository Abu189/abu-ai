<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABU AI - Your AI, Your World</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 18px;
  background: #121a30;
  border-bottom: 1px solid #263451;
  text-align: center;
}

header h2 {
  margin: 0;
  color: #55baff;
  font-size: 25px;
}

header p {
  margin: 6px 0 0;
  color: #aab6ce;
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.message {
  padding: 13px 16px;
  margin: 12px 0;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #1768b5;
  margin-left: auto;
}

.bot {
  background: #1b2942;
  margin-right: auto;
}

.welcome {
  text-align: center;
  margin-top: 65px;
  color: #dceaff;
}

.welcome h1 {
  color: #55baff;
}

footer {
  padding: 12px;
  background: #121a30;
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 25px;
  border: 1px solid #334563;
  background: #1b2942;
  color: white;
  outline: none;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 25px;
  padding: 0 20px;
  background: #1685e8;
  color: white;
  font-weight: bold;
  font-size: 15px;
}

button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <h2>ABU AI 🤖</h2>
  <p>Your AI, Your World.</p>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h1>Welcome to ABU AI</h1>
    <p>Your personal intelligent assistant.</p>
    <p>Ask me anything!</p>
  </div>
</div>

<footer>
  <input
    id="message"
    type="text"
    placeholder="Ask ABU AI anything..."
    onkeydown="if(event.key==='Enter') sendMessage()"
  >
  <button id="send" onclick="sendMessage()">Send</button>
</footer>

<script>
async function sendMessage() {
  const input = document.getElementById("message");
  const button = document.getElementById("send");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message || button.disabled) return;

  document.getElementById("welcome")?.remove();

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;
  chat.appendChild(userMessage);

  input.value = "";
  button.disabled = true;

  const loading = document.createElement("div");
  loading.className = "message bot";
  loading.textContent = "ABU AI is thinking...";
  chat.appendChild(loading);

  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();
    loading.textContent = response.ok
      ? data.reply
      : "Error: " + (data.error || "Something went wrong.");

  } catch (error) {
    loading.textContent = "Connection error. Please try again.";
  }

  button.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
