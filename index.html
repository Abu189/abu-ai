<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABU AI - Your Personal AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #090d18;
    color: white;
}

header {
    padding: 20px;
    background: #111a2d;
    border-bottom: 1px solid #263653;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 14px;
    background: linear-gradient(135deg,#1677ff,#8b4dff);
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: bold;
}

header h2 {
    margin: 0;
}

header p {
    margin: 5px 0 0;
    color: #8ea4c5;
    font-size: 12px;
}

main {
    max-width: 750px;
    margin: auto;
    padding: 25px 16px;
}

.welcome {
    text-align: center;
    margin: 65px 0 35px;
}

.welcome h1 {
    font-size: 32px;
}

.welcome span {
    color: #568dff;
}

.welcome p {
    color: #9aaac4;
    line-height: 1.6;
}

#chat {
    min-height: 250px;
    padding-bottom: 20px;
}

.message {
    padding: 14px;
    border-radius: 15px;
    margin: 12px 0;
    line-height: 1.6;
    max-width: 90%;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #1e3d70;
    margin-left: auto;
}

.bot {
    background: #17243a;
    margin-right: auto;
}

.input-area {
    position: sticky;
    bottom: 10px;
    background: #111a2d;
    padding: 12px;
    border: 1px solid #304362;
    border-radius: 17px;
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
}

button {
    background: #397cff;
    border: none;
    border-radius: 12px;
    color: white;
    padding: 12px 18px;
    font-size: 16px;
}

footer {
    text-align: center;
    color: #657894;
    font-size: 12px;
    padding: 25px;
}
</style>
</head>

<body>

<header>
    <div class="logo">A</div>
    <div>
        <h2>ABU AI</h2>
        <p>Your Personal Intelligent Assistant</p>
    </div>
</header>

<main>

<div class="welcome" id="welcome">
    <h1>Hello, I'm <span>ABU AI</span> 🤖</h1>
    <p>Your AI assistant is ready to help.<br>
    Ask me anything and explore the world!</p>
</div>

<div id="chat"></div>

<div class="input-area">
    <input id="question" placeholder="Message ABU AI...">
    <button onclick="sendMessage()">➤</button>
</div>

</main>

<footer>
    © 2026 ABU AI. All Rights Reserved.
</footer>

<script>
function sendMessage() {
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const text = input.value.trim();

    if (!text) return;

    document.getElementById("welcome").style.display = "none";

    const user = document.createElement("div");
    user.className = "message user";
    user.textContent = text;
    chat.appendChild(user);

    const bot = document.createElement("div");
    bot.className = "message bot";
    bot.textContent = "Welcome to ABU AI! Our AI brain is coming soon. Please stay tuned!";
    chat.appendChild(bot);

    input.value = "";
    window.scrollTo(0, document.body.scrollHeight);
}

document.getElementById("question").addEventListener("keydown", function(e) {
    if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
